          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: workspace.backup
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: backup_id
    turnStart:
      name: turn.start
      title: turn.start
      summary: Start an agent turn.
      description: Harness to executor request (capability agent). Opens the agent session on first use (no session.assign) or continues it; executor_session_ref from an earlier TurnStartResult lets the executor resume its local conversation after a restart. The executor answers as soon as the turn is accepted and reports progress with session.event. Idempotent by turn_id. A session with a running turn answers -32013 conflict (use turn.input); a new session beyond max_sessions answers -32009.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: turn.start
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              input_id:
                type: string
              input:
                type: array
                minItems: 1
                items:
                  $ref: schemas/agent.json#/$defs/AgentInputBlock
              executor_session_ref:
                type: string
              config:
                $ref: schemas/agent.json#/$defs/AgentTurnConfig
              deadline_ms:
                type: integer
                minimum: 1
              metadata:
                type: object
                additionalProperties:
                  type: string
            required:
              - session_id
              - turn_id
              - input_id
              - input
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: turn.start
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: turn_id
    turnInput:
      name: turn.input
      title: turn.input
      summary: Add user input to the running turn.
      description: Harness to executor request (capability agent). The local agent consumes the input at its next step. Idempotent by input_id. When turn_id is not the running turn the executor answers -32013 conflict and the harness starts a new turn instead.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: turn.input
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
