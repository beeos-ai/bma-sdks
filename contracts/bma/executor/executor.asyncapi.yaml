      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.close
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              reason:
                type: string
            required:
              - session_id
              - reason
        required:
          - jsonrpc
          - id
          - method
          - params
