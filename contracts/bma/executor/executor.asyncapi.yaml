    sessionEventDelta:
      name: session.event_delta
      title: session.event_delta
      summary: Stream a preview of a durable agent event.
      description: Executor to harness notification (capability agent). Transient and lossy; never acknowledged or resent. event_id is the event_id of the durable session.event that finalizes the preview. The harness relays it to subscribers as Anthropic event_start and event_delta.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          method:
            type: string
            const: session.event_delta
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              event_id:
                type: string
              event_type:
                $ref: schemas/agent.json#/$defs/EventDeltaType
              index:
                type: integer
                minimum: 0
              text:
                type: string
            required:
              - session_id
              - turn_id
              - event_id
              - event_type
              - index
              - text
        required:
          - jsonrpc
          - method
          - params
      x-bma-jsonrpc-method: session.event_delta
      x-bma-direction: executor-to-harness
      x-bma-kind: notification
      x-bma-channel: control
    interactionRequest:
      name: interaction.request
      title: interaction.request
      summary: Ask the platform for an approval or an answer.
      description: Executor to harness request (capability agent). The harness opens one platform agent interaction (the same request on desktop, mobile and integrations) and answers with interaction.response later. Idempotent by interaction_id. A permission request references the agent.tool_use event in tool_use_id, sent earlier with evaluated_permission ask. The executor keeps local authority; it may still deny, and it treats expires_at as a local deny.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: interaction.request
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              interaction_id:
                type: string
              kind:
                $ref: schemas/agent.json#/$defs/InteractionKind
              tool_use_id:
                type: string
              tool_name:
                type: string
              tool_input:
                type: object
                additionalProperties: true
              scopes:
                type: array
                items:
                  $ref: schemas/agent.json#/$defs/InteractionScope
              question:
                $ref: schemas/agent.json#/$defs/InteractionQuestion
              expires_at:
                type: string
            required:
              - session_id
              - turn_id
              - interaction_id
              - kind
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: interaction.request
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: interaction_id
    interactionResponse:
      name: interaction.response
      title: interaction.response
      summary: Deliver the answer to an interaction.
      description: Harness to executor request (capability agent). Sent once the platform interaction resolves, expires or is canceled; retried with the same interaction_id until answered. The first answer wins; a repeat or an unknown interaction answers accepted=false.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: interaction.response
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              interaction_id:
                type: string
              outcome:
                $ref: schemas/agent.json#/$defs/InteractionOutcome
              scope:
                $ref: schemas/agent.json#/$defs/InteractionScope
              deny_message:
                type: string
              answers:
                type: array
                items:
                  type: string
              responder:
                $ref: schemas/agent.json#/$defs/InteractionResponder
            required:
              - session_id
              - interaction_id
              - outcome
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: interaction.response
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: interaction_id
    interactionCancel:
      name: interaction.cancel
      title: interaction.cancel
      summary: Withdraw an open interaction.
      description: Executor to harness request (capability agent). The executor no longer needs the answer, for example the user answered in the local UI (resolved_locally) or the turn was canceled. The harness cancels the platform interaction so every client dismisses it. Idempotent by interaction_id.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: interaction.cancel
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              interaction_id:
                type: string
              reason:
                $ref: schemas/agent.json#/$defs/InteractionCancelReason
            required:
              - session_id
              - interaction_id
              - reason
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: interaction.cancel
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: interaction_id
