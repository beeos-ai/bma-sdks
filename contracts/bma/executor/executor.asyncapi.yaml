asyncapi: 3.0.0
id: https://contracts.bma.beeos.ai/executor.asyncapi
info:
  title: BMA Executor Protocol channels
  version: 1.1.0
  description: WebSocket channels for bma.executor.v1 and bma.executor.v1.1. The control channel carries JSON-RPC 2.0 requests, notifications, and responses. The mcp channel carries raw MCP JSON-RPC with no BMA wrapper. PTY bytes travel on per-attach outbound host sockets (subprotocol bma.terminal.v1), not on these channels.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json
servers:
  control:
    host: "{host}"
    protocol: wss
    protocolVersion: "1.1"
    pathname: /v1/executors/channel
    description: Executor control channel. Token is a short-lived executor JWT.
    security:
      - $ref: "#/components/securitySchemes/executorJWT"
    variables:
      host:
        default: api.bma.beeos.ai
        description: BMA API host.
  mcp:
    host: "{host}"
    protocol: wss
    protocolVersion: "1.1"
    pathname: /v1/executors/channel
    description: Raw MCP JSON-RPC channel for one environment-origin MCP server.
    security:
      - $ref: "#/components/securitySchemes/executorJWT"
    variables:
      host:
        default: api.bma.beeos.ai
        description: BMA API host.
channels:
  control:
    address: /v1/executors/channel?channel=control
    title: Executor control channel
    description: "Subprotocol bma.executor.v1.1 or bma.executor.v1; the server selects one and executor.register.protocol must equal it. Max outbound control frame: 64 KiB UTF-8. Close codes: 4001 token expired, 4003 unsupported protocol, 4004 replaced, 4005 drained."
    messages:
      executorRegister:
        $ref: "#/components/messages/executorRegister"
      executorHeartbeat:
        $ref: "#/components/messages/executorHeartbeat"
      executorTokenRefresh:
        $ref: "#/components/messages/executorTokenRefresh"
      executorCapabilitiesUpdate:
        $ref: "#/components/messages/executorCapabilitiesUpdate"
      executorDrain:
        $ref: "#/components/messages/executorDrain"
      executorClose:
        $ref: "#/components/messages/executorClose"
      sessionAssign:
        $ref: "#/components/messages/sessionAssign"
      sessionReady:
        $ref: "#/components/messages/sessionReady"
      sessionEvent:
        $ref: "#/components/messages/sessionEvent"
      sessionStatus:
        $ref: "#/components/messages/sessionStatus"
      sessionStop:
        $ref: "#/components/messages/sessionStop"
      sessionEnded:
        $ref: "#/components/messages/sessionEnded"
      toolCall:
        $ref: "#/components/messages/toolCall"
      toolResult:
        $ref: "#/components/messages/toolResult"
      toolCancel:
        $ref: "#/components/messages/toolCancel"
      toolProgress:
        $ref: "#/components/messages/toolProgress"
      processStart:
        $ref: "#/components/messages/processStart"
      processRead:
        $ref: "#/components/messages/processRead"
      processWrite:
        $ref: "#/components/messages/processWrite"
      processInterrupt:
        $ref: "#/components/messages/processInterrupt"
      processTerminate:
        $ref: "#/components/messages/processTerminate"
      processList:
        $ref: "#/components/messages/processList"
      processStatus:
        $ref: "#/components/messages/processStatus"
      terminalOpen:
        $ref: "#/components/messages/terminalOpen"
      terminalAttach:
        $ref: "#/components/messages/terminalAttach"
      terminalClose:
        $ref: "#/components/messages/terminalClose"
      skillInstall:
        $ref: "#/components/messages/skillInstall"
      workspaceBackup:
        $ref: "#/components/messages/workspaceBackup"
      turnStart:
        $ref: "#/components/messages/turnStart"
      turnInput:
        $ref: "#/components/messages/turnInput"
      turnCancel:
        $ref: "#/components/messages/turnCancel"
      sessionClose:
        $ref: "#/components/messages/sessionClose"
      sessionEventDelta:
        $ref: "#/components/messages/sessionEventDelta"
      interactionRequest:
        $ref: "#/components/messages/interactionRequest"
      interactionResponse:
        $ref: "#/components/messages/interactionResponse"
      interactionCancel:
        $ref: "#/components/messages/interactionCancel"
      jsonRpcSuccessResponse:
        $ref: "#/components/messages/jsonRpcSuccessResponse"
      jsonRpcErrorResponse:
        $ref: "#/components/messages/jsonRpcErrorResponse"
  mcp:
    address: /v1/executors/channel?channel=mcp
    title: Executor MCP channel
    description: Raw MCP JSON-RPC for one environment-origin MCP server. Connect with ?channel=mcp&session_id=<id>&server_key=<key>. No BMA wrapper and no mcp.start/mcp.frame/mcp.stop methods.
    messages:
      mcpInitialize:
        $ref: "#/components/messages/mcpInitialize"
      mcpInitialized:
        $ref: "#/components/messages/mcpInitialized"
      mcpToolsList:
        $ref: "#/components/messages/mcpToolsList"
      mcpToolsCall:
        $ref: "#/components/messages/mcpToolsCall"
      mcpProgress:
        $ref: "#/components/messages/mcpProgress"
      mcpRequest:
        $ref: "#/components/messages/mcpRequest"
      mcpNotification:
        $ref: "#/components/messages/mcpNotification"
      mcpSuccessResponse:
        $ref: "#/components/messages/mcpSuccessResponse"
      mcpErrorResponse:
        $ref: "#/components/messages/mcpErrorResponse"
