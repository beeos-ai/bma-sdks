            const: workspace.backup
          params:
            type: object
            additionalProperties: false
            properties:
              backup_id:
                type: string
              paths:
                type: array
                items:
                  type: string
              exclude:
                type: array
                items:
                  type: string
              skip_if_fingerprint:
                type: string
