components:
  messages:
    executorRegister:
      name: executor.register
      title: executor.register
      summary: Register an executor connection.
      description: Executor to harness request, the first frame on the control channel. protocol MUST equal the negotiated WebSocket subprotocol; otherwise the server answers -32010 and closes with 4003. A machine-scoped executor sends an empty environment_id. resume.active_sessions reattaches sessions after reconnect.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: executor.register
          params:
            type: object
            additionalProperties: false
            properties:
              protocol:
                $ref: schemas/common.json#/$defs/ProtocolVersion
              environment_id:
                type: string
              executor:
                $ref: schemas/executor.json#/$defs/ExecutorInfo
              capabilities:
                $ref: schemas/executor.json#/$defs/Capabilities
              resume:
                $ref: schemas/executor.json#/$defs/ExecutorResume
            required:
              - protocol
              - environment_id
              - executor
              - capabilities
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: executor.register
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
    executorHeartbeat:
      name: executor.heartbeat
      title: executor.heartbeat
      summary: Refresh the executor lease.
      description: Executor to harness request, sent every heartbeat_interval_ms. Two missed heartbeats expire the lease server-side. drain=true means the executor must stop accepting new sessions and finish current work.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: executor.heartbeat
          params:
            type: object
            additionalProperties: false
            properties:
              connection_id:
                type: string
              active_sessions:
                type: array
                items:
                  type: string
              load:
                $ref: schemas/common.json#/$defs/ExecutorLoad
            required:
              - connection_id
              - active_sessions
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: executor.heartbeat
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
    executorTokenRefresh:
      name: executor.token.refresh
      title: executor.token.refresh
      summary: Extend the connection with a fresh executor token.
      description: Executor to harness request. Before the current token expires the executor fetches a new one from POST /v1/executors/token with its original credential and sends it on the open control channel. The harness verifies that it names the same executor, scope and machine credential as the connection and moves the connection's 4001 deadline to the new token's expiry; nothing else about the connection changes. A rejected token leaves the old deadline in place. A harness without the method answers -32601; the executor then keeps reconnecting on 4001.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: executor.token.refresh
          params:
            type: object
            additionalProperties: false
            properties:
              token:
                type: string
            required:
              - token
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: executor.token.refresh
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
    executorCapabilitiesUpdate:
      name: executor.capabilities.update
      title: executor.capabilities.update
      summary: Publish changed executor capabilities.
      description: Executor to harness notification. It may change capabilities, not the protocol version.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          method:
            type: string
            const: executor.capabilities.update
          params:
            type: object
            additionalProperties: false
            properties:
              capabilities:
                $ref: schemas/executor.json#/$defs/Capabilities
            required:
              - capabilities
        required:
          - jsonrpc
          - method
          - params
      x-bma-jsonrpc-method: executor.capabilities.update
      x-bma-direction: executor-to-harness
      x-bma-kind: notification
      x-bma-channel: control
    executorDrain:
      name: executor.drain
      title: executor.drain
      summary: Ask the executor to drain.
      description: Harness to executor request. The executor stops accepting new sessions, finishes current work, and reports active_sessions.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: executor.drain
          params:
            type: object
            additionalProperties: false
            properties:
              reason:
                type: string
              deadline_ms:
                type: integer
                minimum: 1
            required:
              - reason
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: executor.drain
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
    executorClose:
      name: executor.close
      title: executor.close
      summary: Close the executor connection.
      description: Either side notification, followed by WebSocket close code 1000 or 1001.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          method:
            type: string
            const: executor.close
          params:
            type: object
            additionalProperties: false
            properties:
              reason:
                type: string
            required:
              - reason
        required:
          - jsonrpc
          - method
          - params
      x-bma-jsonrpc-method: executor.close
      x-bma-direction: bidirectional
      x-bma-kind: notification
      x-bma-channel: control
    sessionAssign:
      name: session.assign
      title: session.assign
      summary: Assign a session to the executor.
      description: Harness to executor request. The executor rejects a session that exceeds its capability or resource limits with -32009. metadata.source "harness" marks a long-lived harness session; any other source is one-shot and ends after its tool call.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.assign
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              work_id:
                type: string
              agent_id:
                type: string
              environment_id:
                type: string
              deadline_ms:
                type: integer
                minimum: 1
              lease:
                $ref: schemas/common.json#/$defs/Lease
              resources:
                type: array
                items:
                  $ref: schemas/session.json#/$defs/SessionMemoryResource
                x-go-type: "[]json.RawMessage"
              mcp_servers:
                type: array
                items:
                  $ref: schemas/mcp.json#/$defs/McpServerConfig
              metadata:
                type: object
                additionalProperties:
                  type: string
            required:
              - session_id
              - work_id
              - environment_id
              - lease
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session.assign
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
    sessionReady:
      name: session.ready
      title: session.ready
      summary: Report a session ready.
      description: Executor to harness request after session.assign is accepted.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.ready
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              work_id:
                type: string
              lease_token:
                type: string
            required:
              - session_id
              - work_id
              - lease_token
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session.ready
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
    sessionEvent:
      name: session.event
      title: session.event
      summary: Emit a durable session event.
      description: Executor to harness request for durable session events. A tool executor's event is idempotent by its JSON-RPC id. An agent executor (capability agent) also sends turn_id, event_id and sequence; the harness deduplicates by (session_id, event_id), accepts a sequence at or below acked_sequence as a duplicate, and rejects a gap with -32013 conflict (data.expected_sequence). An agent event matches schemas/agent.json AgentEvent. The JSON-RPC response is the ACK; the executor keeps every unacked event and resends them in sequence order after reconnect, before any new event.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.event
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              event_id:
                type: string
              sequence:
                type: integer
                minimum: 1
              event:
                $ref: schemas/session.json#/$defs/SessionEvent
                x-go-type: json.RawMessage
            required:
              - session_id
              - event
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session.event
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: jsonrpc_id
    sessionStatus:
      name: session.status
      title: session.status
      summary: Report session status.
      description: Executor to harness notification. detail carries free-form context such as tool_running or mcp_unavailable.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          method:
            type: string
            const: session.status
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              status:
                $ref: schemas/session.json#/$defs/SessionStatus
              detail:
                type: string
            required:
              - session_id
              - status
        required:
          - jsonrpc
          - method
          - params
      x-bma-jsonrpc-method: session.status
      x-bma-direction: executor-to-harness
      x-bma-kind: notification
      x-bma-channel: control
    sessionStop:
      name: session.stop
      title: session.stop
      summary: Stop a session.
      description: Harness to executor request. The executor terminates every process and MCP server of the session (SIGTERM, then SIGKILL) and then sends session.ended.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.stop
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              reason:
                type: string
              deadline_ms:
                type: integer
                minimum: 1
            required:
              - session_id
              - reason
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session.stop
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
    sessionEnded:
      name: session.ended
      title: session.ended
      summary: Report a session ended.
      description: Executor to harness request, sent after every process of the session is gone. Retried until accepted.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.ended
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              reason:
                type: string
            required:
              - session_id
              - reason
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session.ended
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
    toolCall:
      name: tool.call
      title: tool.call
      summary: Dispatch a tool call.
      description: Harness to executor request. The executor acknowledges the dispatch and reports the outcome separately with tool.result. A duplicate tool_call_id is acknowledged without re-execution. A tool the executor does not serve is -32012 with data.capability "tool:<name>".
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
