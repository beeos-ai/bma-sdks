          - method
          - params
      x-bma-jsonrpc-method: turn.input
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: input_id
    turnCancel:
      name: turn.cancel
      title: turn.cancel
      summary: Stop the running turn.
      description: Harness to executor request (capability agent). The executor stops the agent loop, cancels its local tool calls, withdraws open interactions (interaction.cancel turn_canceled), and ends the turn with session.status_idle turn_outcome=canceled. The session stays open for the next turn.start. Unlike tool.cancel (one harness-dispatched tool call) and session.stop (a hand session and its processes), it targets only the agent turn.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: turn.cancel
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              reason:
                type: string
            required:
              - session_id
              - turn_id
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: turn.cancel
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
    sessionClose:
      name: session.close
      title: session.close
      summary: Close an agent session.
      description: Harness to executor request (capability agent). The executor cancels a running turn as turn.cancel does, waits until its events are acknowledged, releases the local conversation, and then sends session.ended. closed=false for an unknown session. A later turn.start with the same session_id starts a new local conversation.
