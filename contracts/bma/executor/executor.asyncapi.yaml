  securitySchemes:
    executorJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Channel-scoped executor JWT fetched from POST /v1/executors/token with an environment key or a machine daemon token. A machine-scoped JWT carries machine_id and daemon_token_id.
x-bma-token-endpoint:
  method: POST
  path: /v1/executors/token
  authentication:
    - environment-key
    - machine-daemon-token
  request:
    $ref: schemas/executor.json#/$defs/ExecutorTokenRequest
  response:
    $ref: schemas/executor.json#/$defs/ExecutorTokenResponse
