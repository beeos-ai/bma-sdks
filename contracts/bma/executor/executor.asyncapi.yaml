          method:
            type: string
            const: terminal.attach
          params:
            type: object
            additionalProperties: false
            properties:
              terminal_id:
                type: string
              epoch:
                type: integer
              stream_id:
                type: string
              can_write:
                type: boolean
              from_seq:
                type: integer
              ack_seq:
                type: integer
              host:
                $ref: schemas/terminal.json#/$defs/TerminalHost
            required:
