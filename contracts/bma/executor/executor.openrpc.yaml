openrpc: 1.2.6
info:
  title: BMA Executor Protocol
  version: 1.1.0
  description: >-
    Machine-readable method catalog for bma.executor.v1 and bma.executor.v1.1, the outbound
    WebSocket + JSON-RPC 2.0 contract between a BMA harness and an executor. The prose lives in
    docs/architecture/executor-protocol-v1.md and the v1.1 delta doc. JSON-RPC params are named
    object members; each OpenRPC param is one member.


    x-bma-since is the first protocol that has the method; a server never sends a v1.1 method to a
    v1 connection. x-bma-capability names the capability bit the harness checks before sending the
    method; an executor without it answers -32012 capability_unavailable.


    WebSocket close codes: 4001 token expired (reconnect with a new token), 4003 unsupported
    protocol, 4004 replaced by a newer connection for the same executor (stop), 4005 drained
    (reconnect).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - name: control
    url: wss://{host}/v1/executors/channel?channel=control
    summary: Executor control channel.
    variables:
      host:
        default: api.bma.beeos.ai
        description: BMA API host.
  - name: mcp
    url: wss://{host}/v1/executors/channel?channel=mcp&session_id={session_id}&server_key={server_key}
    summary: Raw MCP JSON-RPC channel for one environment-origin MCP server.
    variables:
      host:
        default: api.bma.beeos.ai
        description: BMA API host.
      session_id:
        default: sess_example
        description: Assigned session id.
      server_key:
        default: chrome
        description: MCP server key from the session assignment.
methods:
  - name: executor.register
    summary: Register an executor connection.
    description: Executor to harness request, the first frame on the control channel. protocol MUST
      equal the negotiated WebSocket subprotocol; otherwise the server answers -32010 and closes
      with 4003. A machine-scoped executor sends an empty environment_id. resume.active_sessions
      reattaches sessions after reconnect.
    tags:
      - name: executor
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: protocol
        required: true
        schema:
          $ref: schemas/common.json#/$defs/ProtocolVersion
      - name: environment_id
        required: true
        description: Selfhost environment id; empty for a machine-scoped executor.
        schema:
          type: string
      - name: executor
        required: true
        schema:
          $ref: schemas/executor.json#/$defs/ExecutorInfo
      - name: capabilities
        required: true
        schema:
          $ref: schemas/executor.json#/$defs/Capabilities
      - name: resume
        required: false
        schema:
          $ref: schemas/executor.json#/$defs/ExecutorResume
    result:
      name: ExecutorRegisterResult
      schema:
        $ref: schemas/executor.json#/$defs/ExecutorRegisterResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/InvalidRequest"
      - $ref: "#/components/errors/Unauthorized"
      - $ref: "#/components/errors/Forbidden"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/PayloadTooLarge"
      - $ref: "#/components/errors/UnsupportedProtocol"
      - $ref: "#/components/errors/InternalError"
  - name: executor.heartbeat
    summary: Refresh the executor lease.
    description: Executor to harness request, sent every heartbeat_interval_ms. Two missed heartbeats
      expire the lease server-side. drain=true means the executor must stop accepting new sessions
      and finish current work.
    tags:
      - name: executor
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: connection_id
        required: true
        schema:
          type: string
      - name: active_sessions
        required: true
        schema:
          type: array
          items:
            type: string
      - name: load
        required: false
        schema:
          $ref: schemas/common.json#/$defs/ExecutorLoad
    result:
      name: ExecutorHeartbeatResult
      schema:
        $ref: schemas/executor.json#/$defs/ExecutorHeartbeatResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/Unauthorized"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/InternalError"
  - name: executor.capabilities.update
    summary: Publish changed executor capabilities.
    description: Executor to harness notification. It may change capabilities, not the protocol version.
    tags:
      - name: executor
    x-bma-direction: executor-to-harness
    x-bma-kind: notification
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: capabilities
        required: true
        schema:
          $ref: schemas/executor.json#/$defs/Capabilities
  - name: executor.drain
    summary: Ask the executor to drain.
    description: Harness to executor request. The executor stops accepting new sessions, finishes
      current work, and reports active_sessions.
    tags:
      - name: executor
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: reason
        required: true
        schema:
          type: string
      - name: deadline_ms
        required: false
        schema:
          type: integer
          minimum: 1
    result:
      name: ExecutorDrainResult
      schema:
        $ref: schemas/executor.json#/$defs/ExecutorDrainResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/InternalError"
  - name: executor.close
    summary: Close the executor connection.
    description: Either side notification, followed by WebSocket close code 1000 or 1001.
    tags:
      - name: executor
    x-bma-direction: bidirectional
    x-bma-kind: notification
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: reason
        required: true
        schema:
          type: string
  - name: session.assign
    summary: Assign a session to the executor.
    description: Harness to executor request. The executor rejects a session that exceeds its capability
      or resource limits with -32009. metadata.source "harness" marks a long-lived harness session;
      any other source is one-shot and ends after its tool call.
    tags:
      - name: session
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: work_id
        required: true
        schema:
          type: string
      - name: agent_id
        required: false
        schema:
          type: string
      - name: environment_id
        required: true
        schema:
          type: string
      - name: deadline_ms
        required: false
        schema:
          type: integer
          minimum: 1
      - name: lease
        required: true
        schema:
          $ref: schemas/common.json#/$defs/Lease
      - name: resources
        required: false
        schema:
          type: array
          items:
            $ref: schemas/session.json#/$defs/SessionMemoryResource
          x-go-type: "[]json.RawMessage"
      - name: mcp_servers
        required: false
        schema:
          type: array
          items:
            $ref: schemas/mcp.json#/$defs/McpServerConfig
      - name: metadata
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
    result:
      name: SessionAssignResult
      schema:
        $ref: schemas/session.json#/$defs/SessionAssignResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/Forbidden"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/ExecutorBusy"
      - $ref: "#/components/errors/InternalError"
  - name: session.ready
    summary: Report a session ready.
    description: Executor to harness request after session.assign is accepted.
    tags:
      - name: session
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: work_id
        required: true
        schema:
          type: string
      - name: lease_token
        required: true
        schema:
          type: string
    result:
      name: Ack
      schema:
        $ref: schemas/common.json#/$defs/Ack
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/InternalError"
  - name: session.event
    summary: Emit a durable session event.
    description: Executor to harness request for durable session events. A tool executor's event is
      idempotent by its JSON-RPC id. An agent executor (capability agent) also sends turn_id,
      event_id and sequence; the harness deduplicates by (session_id, event_id), accepts a sequence at
      or below acked_sequence as a duplicate, and rejects a gap with -32013 conflict
      (data.expected_sequence). An agent event matches schemas/agent.json AgentEvent. The JSON-RPC response is the ACK; the executor keeps every unacked
      event and resends them in sequence order after reconnect, before any new event.
    tags:
      - name: session
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    x-bma-idempotent-by: jsonrpc_id
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: turn_id
        required: false
        description: Agent sessions; the turn that produced the event.
        schema:
          type: string
      - name: event_id
        required: false
        description: Agent sessions; executor-assigned, unique within the session, stable across resends.
        schema:
          type: string
      - name: sequence
        required: false
        description: Agent sessions; starts at 1 and increases by 1 per durable event within the session.
        schema:
          type: integer
          minimum: 1
      - name: event
        required: true
        schema:
          $ref: schemas/session.json#/$defs/SessionEvent
          x-go-type: json.RawMessage
    result:
      name: SessionEventResult
      schema:
        $ref: schemas/session.json#/$defs/SessionEventResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/PayloadTooLarge"
      - $ref: "#/components/errors/Conflict"
      - $ref: "#/components/errors/InternalError"
  - name: session.status
    summary: Report session status.
    description: Executor to harness notification. detail carries free-form context such as tool_running
      or mcp_unavailable.
    tags:
      - name: session
    x-bma-direction: executor-to-harness
    x-bma-kind: notification
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: status
        required: true
        schema:
          $ref: schemas/session.json#/$defs/SessionStatus
      - name: detail
        required: false
        schema:
          type: string
  - name: session.stop
    summary: Stop a session.
    description: Harness to executor request. The executor terminates every process and MCP server of
      the session (SIGTERM, then SIGKILL) and then sends session.ended.
    tags:
      - name: session
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: reason
        required: true
        schema:
          type: string
      - name: deadline_ms
        required: false
        schema:
          type: integer
          minimum: 1
    result:
      name: SessionStopResult
      schema:
        $ref: schemas/session.json#/$defs/SessionStopResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/Timeout"
      - $ref: "#/components/errors/InternalError"
  - name: session.ended
    summary: Report a session ended.
    description: Executor to harness request, sent after every process of the session is gone. Retried
      until accepted.
    tags:
      - name: session
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: reason
        required: true
        schema:
          type: string
    result:
      name: Ack
      schema:
        $ref: schemas/common.json#/$defs/Ack
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/ExecutorBusy"
      - $ref: "#/components/errors/InternalError"
  - name: tool.call
    summary: Dispatch a tool call.
    description: Harness to executor request. The executor acknowledges the dispatch and reports the
      outcome separately with tool.result. A duplicate tool_call_id is acknowledged without
      re-execution. A tool the executor does not serve is -32012 with data.capability "tool:<name>".
    tags:
      - name: tool
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: tool_call_id
        required: true
        schema:
          type: string
      - name: tool
        required: true
        schema:
          $ref: schemas/tool.json#/$defs/ToolName
      - name: input
        required: true
        schema:
          $ref: schemas/tool.json#/$defs/ToolInput
          x-go-type: json.RawMessage
      - name: deadline_ms
        required: false
        schema:
          type: integer
          minimum: 1
      - name: permission
        required: false
        schema:
          $ref: schemas/tool.json#/$defs/ToolPermission
    result:
      name: Ack
      schema:
        $ref: schemas/common.json#/$defs/Ack
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/Forbidden"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/ExecutorBusy"
      - $ref: "#/components/errors/CapabilityUnavailable"
      - $ref: "#/components/errors/InternalError"
  - name: tool.result
    summary: Report a tool result.
    description: Executor to harness request, idempotent by tool_call_id and retried until accepted.
      Large output is uploaded first (POST /v1/executors/artifacts) and referenced by an artifact
      content block.
    tags:
      - name: tool
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    x-bma-idempotent-by: tool_call_id
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: tool_call_id
        required: true
        schema:
          type: string
      - name: outcome
        required: true
        schema:
          $ref: schemas/tool.json#/$defs/ToolOutcome
      - name: is_error
        required: true
        schema:
          type: boolean
      - name: content
        required: true
        schema:
          type: array
          items:
            $ref: schemas/tool.json#/$defs/ContentBlock
      - name: duration_ms
        required: false
        schema:
          type: integer
          minimum: 0
      - name: artifacts
        required: false
        schema:
          type: array
          items:
            $ref: schemas/tool.json#/$defs/ArtifactRef
    result:
      name: Ack
      schema:
        $ref: schemas/common.json#/$defs/Ack
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/PayloadTooLarge"
      - $ref: "#/components/errors/ExecutorBusy"
      - $ref: "#/components/errors/InternalError"
  - name: tool.cancel
    summary: Cancel a running tool call.
    description: Harness to executor request. The executor kills the process group; canceled=false when
      the call is unknown or already finished.
    tags:
      - name: tool
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: tool_call_id
        required: true
        schema:
          type: string
      - name: reason
        required: false
        schema:
          type: string
    result:
      name: ToolCancelResult
      schema:
        $ref: schemas/tool.json#/$defs/ToolCancelResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/InternalError"
  - name: tool.progress
    summary: Report tool progress.
    description: Executor to harness notification, optional.
    tags:
      - name: tool
    x-bma-direction: executor-to-harness
    x-bma-kind: notification
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: tool_call_id
        required: true
        schema:
          type: string
      - name: message
        required: true
        schema:
          type: string
  - name: process.start
    summary: Start a process.
    description: 'Harness to executor request (v1.1 §3.3). Idempotent by (session_id, process_id): a
      repeat returns the live state. wait_ms waits up to that long for the process to end before
      answering. A spawn failure is an error with data.reason "spawn_failed". io_mode, file_transfer
      and git_credentials each require the matching process capability bit.'
    tags:
      - name: process
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: process.enabled
    x-bma-idempotent-by: session_id+process_id
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: process_id
        required: true
        schema:
          type: string
      - name: argv
        required: true
        description: Command and arguments (at most 256 entries, 4 KiB each, 16 KiB total). Must be empty
          when file_transfer is set.
        schema:
          type: array
          items:
            type: string
          maxItems: 256
      - name: cwd
        required: false
        schema:
          type: string
      - name: env
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
      - name: stdin
        required: false
        schema:
          $ref: schemas/process.json#/$defs/StdinMode
      - name: stderr
        required: false
        description: Empty keeps separate stdout/stderr streams.
        schema:
          $ref: schemas/process.json#/$defs/StderrMode
      - name: wait_ms
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 300000
      - name: timeout_ms
        required: false
        description: Kills the process and ends it as failed with reason "timeout".
        schema:
          type: integer
          minimum: 0
          maximum: 86400000
      - name: metadata
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
      - name: io_mode
        required: false
        description: Requires capability process.pty.
        schema:
          $ref: schemas/process.json#/$defs/IOMode
      - name: file_transfer
        required: false
        description: Requires capability process.file_transfer. Excludes argv entries, io_mode and
          git_credentials.
        schema:
          $ref: schemas/process.json#/$defs/ProcessFileTransfer
      - name: git_credentials
        required: false
        description: Installs a per-process Git credential helper for https://github.com that fetches
          short-lived tokens for this process while it runs. Requires capability
          process.git_credentials.
        schema:
          type: boolean
    result:
      name: ProcessState
      schema:
        $ref: schemas/process.json#/$defs/ProcessState
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/ResourceUnavailable"
      - $ref: "#/components/errors/CapabilityUnavailable"
      - $ref: "#/components/errors/Conflict"
      - $ref: "#/components/errors/InternalError"
  - name: process.read
    summary: Read process output from a cursor.
    description: Harness to executor request (v1.1 §3.4). Long-polls up to wait_ms for new bytes.
      gap=true when bytes before earliest_cursor were dropped from the ring buffer.
    tags:
      - name: process
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: process.enabled
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: process_id
        required: true
        schema:
          type: string
      - name: stream
        required: true
        schema:
          $ref: schemas/process.json#/$defs/ProcessStream
      - name: cursor
        required: true
        schema:
          type: integer
          minimum: 0
      - name: max_bytes
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 32768
          x-go-type: int
      - name: wait_ms
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 300000
    result:
      name: ProcessReadResult
      schema:
        $ref: schemas/process.json#/$defs/ProcessReadResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/ExecutorBusy"
      - $ref: "#/components/errors/InternalError"
  - name: process.write
    summary: Write to process stdin.
    description: Harness to executor request (v1.1 §3.5). Exactly one of data (base64, at most 32 KiB
      decoded) or close_stdin. close_stdin is rejected for io_mode "pty".
    tags:
      - name: process
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: process.enabled
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: process_id
        required: true
        schema:
          type: string
      - name: data
        required: false
        schema:
          type: string
      - name: close_stdin
        required: false
        schema:
          type: boolean
    result:
      name: ProcessWriteResult
      schema:
        $ref: schemas/process.json#/$defs/ProcessWriteResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/Conflict"
      - $ref: "#/components/errors/PayloadTooLarge"
      - $ref: "#/components/errors/InternalError"
  - name: process.interrupt
    summary: Interrupt a process (SIGINT).
    description: Harness to executor request (v1.1 §3.6).
    tags:
      - name: process
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: process.enabled
    x-bma-params-type: ProcessSignalParams
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: process_id
        required: true
        schema:
          type: string
      - name: grace_ms
        required: false
        description: Only meaningful for process.terminate.
        schema:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 30000
    result:
      name: ProcessState
      schema:
        $ref: schemas/process.json#/$defs/ProcessState
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/InternalError"
  - name: process.terminate
    summary: Terminate a process (SIGTERM, then SIGKILL after grace_ms).
    description: Harness to executor request (v1.1 §3.6).
    tags:
      - name: process
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: process.enabled
    x-bma-params-type: ProcessSignalParams
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: process_id
        required: true
        schema:
          type: string
      - name: grace_ms
        required: false
        description: Only meaningful for process.terminate.
        schema:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 30000
    result:
      name: ProcessState
      schema:
        $ref: schemas/process.json#/$defs/ProcessState
    errors:
