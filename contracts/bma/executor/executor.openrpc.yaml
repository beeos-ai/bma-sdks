      data:
        $ref: schemas/common.json#/$defs/JsonRpcErrorData
    PayloadTooLarge:
      code: -32006
      message: payload_too_large
      data:
        $ref: schemas/common.json#/$defs/JsonRpcErrorData
    SessionNotActive:
      code: -32007
      message: session_not_active
      data:
        $ref: schemas/common.json#/$defs/JsonRpcErrorData
    McpUnavailable:
      code: -32008
      message: mcp_unavailable
      data:
        $ref: schemas/common.json#/$defs/JsonRpcErrorData
    ExecutorBusy:
