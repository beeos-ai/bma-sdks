name: Release Go SDK

on:
  push:
    branches: [main]
    tags:
      - 'go/v*'
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/release-go.yaml'

permissions:
  contents: read

jobs:
  test:
    name: Test Go module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify release tag is on main
        if: startsWith(github.ref, 'refs/tags/go/v')
        working-directory: .
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test
        run: go test ./...
