name: Contract

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'go/v*'
      - 'ts/v*'
      - 'python/v*'
      - 'executor/v*'
      - 'executor-ts/v*'
      - 'executor-python/v*'
  # The tag release workflows run this same check suite before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: Generated code, contract drift, and SDK tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            executor/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            executor/typescript/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Regenerate every SDK and require no diff
        run: |
          uv run --no-project --with pyyaml ./tools/generate.sh
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Contract drift check
        run: uv run --no-project --with pyyaml --with jsonschema python tools/check_contract.py

      - name: Go
        working-directory: go
        run: |
          go vet ./...
          go test ./...

      - name: TypeScript
        working-directory: typescript
        run: |
          npm run build
          npm test

      - name: Python
        working-directory: python
        run: uv run pytest -q

      - name: Go executor
        working-directory: executor
        run: |
          go vet ./...
          go test -race ./...

      - name: TypeScript executor (with Go and Python interop)
        working-directory: executor/typescript
        run: |
          (cd ../python && uv sync)
          npm ci
          npm run build
          npm test

      - name: Python executor
        working-directory: executor/python
        run: uv run pytest -q

  # The Windows named pipe transport (npipe://) of the three executor SDKs.
  # Only the transport tests run here; the full suites run on ubuntu above.
  windows-named-pipe:
    name: Windows named pipe transport (Go, TypeScript, Python)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: executor/go.mod
          cache-dependency-path: executor/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: executor/typescript/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Go executor (named pipe, both directions)
        working-directory: executor
        run: |
          go vet ./...
          go test -count=1 -v -run 'NamedPipe|ChannelURLAcceptsNamedPipes|ExecutorDialsAHarnessOnANamedPipe' .

      - name: Python executor (named pipe, Go interop)
        working-directory: executor/python
        run: |
          uv sync
          uv run pytest -v tests/test_npipe.py
          uv run pytest -v -k npipe tests/test_executor_runtime.py tests/test_executor_interop.py

      - name: TypeScript executor (local socket tests on a pipe, Go and Python interop)
        working-directory: executor/typescript
        env:
          BMA_PYTHON: ${{ github.workspace }}/executor/python/.venv/Scripts/python.exe
        run: |
          npm ci
          npx tsc -p tsconfig.test.json
          node --test --test-name-pattern='local socket|npipe' build-test/test/executor.test.js
          node --test build-test/test/interop-go-unix.test.js build-test/test/interop-python.test.js
