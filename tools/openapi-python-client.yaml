# openapi-python-client settings shared by both generated Python packages.
literal_enums: true
post_hooks:
  - uvx ruff==0.17.3 check . --fix-only --select I,F401 --quiet
  - uvx ruff==0.17.3 format . --quiet
# The REST `File` schema would shadow the generator's own `types.File` upload
# payload in the same module (upload_file then parses responses with the
# wrong class), so the model is generated as ProjectFile.
class_overrides:
  File:
    class_name: ProjectFile
    module_name: project_file
