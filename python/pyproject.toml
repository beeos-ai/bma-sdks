[project]
name = "bma-sdk"
version = "0.3.0"
description = "Python client for the BMA REST API and the BMA extensions to the Anthropic Managed Agents API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "attrs>=22.2.0",
  "httpx>=0.27,<1",
  "python-dateutil>=2.8.0",
]

[project.urls]
Repository = "https://github.com/beeos-ai/bma-sdks"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bma_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
